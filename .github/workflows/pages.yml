name: Validate and publish themes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  registry:
    uses: phranck/velvet/.github/workflows/theme-registry.yml@issue/36-centralize-theme-registry
    with:
      publish: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      pages: write
      id-token: write
